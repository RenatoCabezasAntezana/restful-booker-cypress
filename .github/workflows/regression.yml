name: Cypress Apis Regression Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      testPlanKey:
        description: 'ID del Test Plan (ej. SB-10)'
        required: false
        type: string
      projectKey:
        description: 'ID del Proyecto (ej. SB)'
        required: false
        type: string
  repository_dispatch:
    types: [run-cypress-tests]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      # --- PASO DE VALIDACIÓN MEJORADO ---
      - name: 🔍 Debug Xray Context
        run: |
          echo "Evento disparado por: ${{ github.event_name }}"
          echo "--- Valores desde Payload (Web) ---"
          echo "Project (Payload): ${{ github.event.client_payload.projectKey }}"
          echo "Test Plan (Payload): ${{ github.event.client_payload.testPlanKey }}"
          echo "--- Valores desde Inputs (Manual) ---"
          echo "Project (Input): ${{ github.event.inputs.projectKey }}"
          echo "--- Verificación de Secrets ---"
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then echo "❌ XRAY_CLIENT_ID no está configurado"; else echo "✅ XRAY_CLIENT_ID detectado"; fi
          if [ -z "${{ secrets.PROJECTKEY }}" ]; then echo "⚠️ Secret PROJECTKEY no encontrado, usaré SB por defecto"; fi

      - name: Install dependencies
        run: npm i

      - name: Install Cucumber Formatter (Linux)
        run: |
          curl -L https://github.com/cucumber/json-formatter/releases/download/v19.0.0/cucumber-json-formatter-linux-amd64 -o cucumber-json-formatter
          chmod +x cucumber-json-formatter

      - name: Cypress.io
        continue-on-error: true
        uses: cypress-io/github-action@v6.5.0
        with:
          command: npm run cypress:execution-tags
          browser: chrome
          # record: true # Solo actívalo si tienes configurado Cypress Cloud
        env:
          CUCUMBER_JSON_FORMATTER: ./cucumber-json-formatter
                
      - name: 🚀 Authenticate and Import to Xray
        if: always()
        run: |
          # 1. OBTENER TOKEN DE ACCESO (JWT)
          # Enviamos las credenciales y limpiamos las comillas del token resultante
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "❌ Error: No se pudo obtener el token de Xray. Revisa tus Secrets."
            exit 1
          fi
          echo "✅ Token de Xray obtenido correctamente."

          # 2. DEFINIR VARIABLES DE CONTEXTO
          # Prioridad: Payload Webhook > Input Manual > Secret > Default 'SB'
          PROJECT_KEY="${{ github.event.client_payload.projectKey || github.event.inputs.projectKey || secrets.PROJECTKEY || 'SB' }}"
          TEST_PLAN_KEY="${{ github.event.client_payload.testPlanKey || github.event.inputs.testPlanKey || secrets.TESTPLANKEY }}"

          echo "Project: $PROJECT_KEY"
          echo "Test Plan: ${TEST_PLAN_KEY:-'No especificado (se creará ejecución huérfana)'}"

          # 3. CONSTRUIR URL CON QUERY PARAMS
          # El parámetro 'testPlanKey' es el que hace el "anexo"
          URL="https://xray.cloud.getxray.app/api/v2/import/execution/cucumber?projectKey=$PROJECT_KEY"
          
          if [ -n "$TEST_PLAN_KEY" ]; then
            URL="${URL}&testPlanKey=$TEST_PLAN_KEY"
          fi

          # 4. EJECUTAR IMPORTACIÓN
          # Usamos --data-binary para asegurar que el JSON se envíe sin alteraciones de formato
          RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            --data-binary @cypress/reports/cucumber-results.json \
            "$URL")

          echo "📩 Respuesta de Xray: $RESPONSE"

          # 5. EXTRAER KEY DE LA EJECUCIÓN CON JQ
          # jq extrae el valor del campo "key" de forma segura
          EXEC_KEY=$(echo $RESPONSE | jq -r '.key // empty')

          if [ -n "$EXEC_KEY" ]; then
            echo "✅ Resultados anexados exitosamente."
            echo "🎫 Nueva Test Execution en Jira: $EXEC_KEY"
            echo "🔗 Link: https://tu-dominio.atlassian.net/browse/$EXEC_KEY"
          else
            echo "⚠️ Los resultados se enviaron, pero la respuesta no contiene una Key válida."
            echo "Respuesta completa: $RESPONSE"
          fi
          
      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/**/*.mp4
