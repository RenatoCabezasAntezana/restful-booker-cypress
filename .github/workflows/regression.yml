name: Cypress Apis Regression Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      testPlanKey:
        description: 'ID del Test Plan (ej. SB-10)'
        required: false
        type: string
      projectKey:
        description: 'ID del Proyecto (ej. SB)'
        required: false
        type: string
  repository_dispatch:
    types: [run-cypress-tests]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      # --- PASO DE VALIDACIÓN MEJORADO ---
      - name: 🔍 Debug Xray Context
        run: |
          echo "Evento disparado por: ${{ github.event_name }}"
          echo "--- Valores desde Payload (Web) ---"
          echo "Project (Payload): ${{ github.event.client_payload.projectKey }}"
          echo "Test Plan (Payload): ${{ github.event.client_payload.testPlanKey }}"
          echo "--- Valores desde Inputs (Manual) ---"
          echo "Project (Input): ${{ github.event.inputs.projectKey }}"
          echo "--- Verificación de Secrets ---"
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then echo "❌ XRAY_CLIENT_ID no está configurado"; else echo "✅ XRAY_CLIENT_ID detectado"; fi
          if [ -z "${{ secrets.PROJECTKEY }}" ]; then echo "⚠️ Secret PROJECTKEY no encontrado, usaré SB por defecto"; fi

      - name: Install dependencies
        run: npm i

      - name: Install Cucumber Formatter (Linux)
        run: |
          curl -L https://github.com/cucumber/json-formatter/releases/download/v19.0.0/cucumber-json-formatter-linux-amd64 -o cucumber-json-formatter
          chmod +x cucumber-json-formatter

      - name: Cypress.io
        continue-on-error: true
        uses: cypress-io/github-action@v6.5.0
        with:
          command: npm run cypress:execution-tags
          browser: chrome
          # record: true # Solo actívalo si tienes configurado Cypress Cloud
        env:
          CUCUMBER_JSON_FORMATTER: ./cucumber-json-formatter
                
      - name: 🚀 Import to Xray (Force Link to Test Plan)
        if: always()
        run: |
          # 1. Obtener Token
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')

          # 2. Definir Keys (Asegúrate de que SB-54 sea un Test Plan válido)
          PROJECT_KEY="SB"
          TEST_PLAN_KEY="SB-54" 

          echo "Configurando importación para Proyecto: $PROJECT_KEY y Plan: $TEST_PLAN_KEY"

          # 3. Importación con URL Protegida por Comillas
          # Importante: Usamos "${URL}" para que el & no rompa el comando
          RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            --data-binary @cypress/reports/cucumber-results.json \
            "https://xray.cloud.getxray.app/api/v2/import/execution/cucumber?projectKey=${PROJECT_KEY}&testPlanKey=${TEST_PLAN_KEY}")

          echo "📩 Respuesta de Xray: $RESPONSE"

          # 4. Verificación con JQ
          EXEC_KEY=$(echo $RESPONSE | jq -r '.key // empty')

          if [ -n "$EXEC_KEY" ] && [ "$EXEC_KEY" != "null" ]; then
            echo "✅ EXECUCIÓN CREADA: $EXEC_KEY"
            echo "🔎 REVISA AQUÍ: https://renatosistemas02.atlassian.net/browse/$TEST_PLAN_KEY"
            echo "La ejecución $EXEC_KEY debería aparecer en la pestaña 'Test Board' o 'Test Executions' del plan."
          else
            echo "❌ ERROR: No se recibió una Key de Xray. Revisa el formato del JSON."
            exit 1
          fi
          
      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/**/*.mp4
